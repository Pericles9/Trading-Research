 its plateau, which is visible here at ~1e-4 s. The pre-registered crossing statistic does not measure the quantity C3 requires it to measure.\u003cbr\u003e\u003cb\u003eC1 inside 0.871, C2 0.774\u003c\u002fb\u003e (required ≥ 0.90, taken as the minimum over eligible h) — FAIL. At h ≫ the profile's own timescale the null cannot represent the profile, so C2 leaves a band that was never matched to it; at T ≳ h the plug-in null inherits λ̂'s estimation error and sits above a truly Poisson C1.\u003cbr\u003e\u003cb\u003econfig_hash:\u003c\u002fb\u003e d9554f55","x":0,"xanchor":"left","xref":"paper","y":-0.4,"yanchor":"top","yref":"paper"}],"shapes":[{"line":{"color":"#C23531","dash":"dash","width":1.4},"type":"line","x0":0.00001,"x1":0.00001,"xref":"x3","y0":0,"y1":1,"yref":"y3 domain"},{"line":{"color":"#C23531","dash":"dash","width":1.4},"type":"line","x0":0.00001,"x1":0.00001,"xref":"x4","y0":0,"y1":1,"yref":"y4 domain"},{"line":{"color":"#C23531","dash":"dash","width":1.4},"type":"line","x0":60.0,"x1":60.0,"xref":"x4","y0":0,"y1":1,"yref":"y4 domain"}],"font":{"family":"Inter, Segoe UI, system-ui, sans-serif","size":13,"color":"#0b0b0b"},"margin":{"l":90,"r":50,"t":115,"b":280},"legend":{"font":{"size":11.5},"orientation":"h","yanchor":"top","y":-0.2,"xanchor":"left","x":0,"bgcolor":"rgba(0,0,0,0)"},"title":{"text":"\u003cb\u003e04 — Synthetic control harness: does the pipeline recover a known answer?\u003c\u002fb\u003e\u003cbr\u003e\u003cspan style='font-size:12.5px;color:#52514e'\u003eEach control is run through the SAME T3\u002fT4 pipeline the real cohort would use. Shaded regions are 95% matched-null bands (200 draws) from an out-of-sample λ̂ at each bandwidth h; faded bands are bandwidths where λ̂ collapses to the floor (h below the 60 s held-out block) and are excluded. Dark line is the control's own Allan curve, drawn at the widest h. Red dashes mark the injected timescales.\u003c\u002fspan\u003e","x":0.0,"xanchor":"left","y":0.97,"yanchor":"top"},"paper_bgcolo
