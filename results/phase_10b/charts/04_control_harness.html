ctly what T2-R0 predicted. \u003cb\u003eC2 fails\u003c\u002fb\u003e at 0.871 (h=1024 s).\u003cbr\u003e\u003cb\u003eRe-assertions hold:\u003c\u002fb\u003e C3 plateau 5.9852 vs 6.0000 (-0.246%), C4 separation 4,194,304, coverage 0.9292–0.9497.\u003cbr\u003e\u003cb\u003econfig_hash:\u003c\u002fb\u003e 5fd653e4","x":0,"xanchor":"left","xref":"paper","y":-0.4,"yanchor":"top","yref":"paper"}],"shapes":[{"line":{"color":"#111111","dash":"dot","width":1.6},"type":"line","x0":256.0,"x1":256.0,"xref":"x","y0":0,"y1":1,"yref":"y domain"},{"line":{"color":"#111111","dash":"dot","width":1.6},"type":"line","x0":64.0,"x1":64.0,"xref":"x2","y0":0,"y1":1,"yref":"y2 domain"},{"line":{"color":"#111111","dash":"dot","width":1.6},"type":"line","x0":0.000030517578125,"x1":0.000030517578125,"xref":"x3","y0":0,"y1":1,"yref":"y3 domain"},{"line":{"color":"#111111","dash":"dot","width":1.6},"type":"line","x0":256.0,"x1":256.0,"xref":"x3","y0":0,"y1":1,"yref":"y3 domain"},{"line":{"color":"#C23531","dash":"dash","width":2},"type":"line","x0":0.00001,"x1":0.00001,"xref":"x3","y0":0,"y1":1,"yref":"y3 domain"},{"line":{"color":"#111111","dash":"dot","width":1.6},"type":"line","x0":0.000244140625,"x1":0.000244140625,"xref":"x4","y0":0,"y1":1,"yref":"y4 domain"},{"line":{"color":"#111111","dash":"dot","width":1.6},"type":"line","x0":0.001953125,"x1":0.001953125,"xref":"x4","y0":0,"y1":1,"yref":"y4 domain"},{"line":{"color":"#C23531","dash":"dash","width":2},"type":"line","x0":0.001,"x1":0.001,"xref":"x4","y0":0,"y1":1,"yref":"y4 domain"},{"line":{"color":"#111111","dash":"dot","width":1.6},"type":"line","x0":0.00006103515625,"x1":0.00006103515625,"xref":"x5","y0":0,"y1":1,"yref":"y5 domain"},{"line":{"color":"#111111","dash":"dot","width":1.6},"type":"line","x0":8.0,"x1":8.0,"xref":"x5","y0":0,"y1":1,"yref":"y5 domain"},{"line":{"color":"#C23531","dash":"dash","width":2},"type":"line","x0":60.0,"x1":60.0,"xref":"x5","y0":0,"y1":1,"yref":"y5 domain"},{"line":{"color":"#111111","dash":"dot","width":
